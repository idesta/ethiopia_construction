events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Timeouts & sizing ─────────────────────────
    client_max_body_size 20M;   # allow large image uploads
    sendfile on;
    keepalive_timeout 65;

    # ── Main server block ─────────────────────────
    server {
        listen 80;
        server_name _;

        # Use Docker's internal DNS resolver so nginx re-resolves service
        # hostnames dynamically instead of caching IPs at startup.
        # 127.0.0.11 is the Docker embedded DNS server address.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Backend API
        location /api/ {
            set $backend_upstream http://backend:4000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Uploaded files served by backend
        location /uploads/ {
            set $backend_upstream http://backend:4000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;

            # Cache static uploads
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Everything else → Next.js frontend
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass         $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
