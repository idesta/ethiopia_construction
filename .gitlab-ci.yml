stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - linux_ad_vm-runner
  timeout: 30 minutes
  script:
    - echo "🚀 Deploying to production..."

    # ── Copy source to deploy path ────────────────────────
    - rsync -av --exclude='.git' --exclude='node_modules' $CI_PROJECT_DIR/ /opt/ethiopia-construction/

    # ── Write main SaaS .env ──────────────────────────────
    - |
      cat > /opt/ethiopia-construction/.env << EOF
      POSTGRES_DB=$POSTGRES_DB
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      JWT_SECRET=$JWT_SECRET
      ADMIN_CREATE_SECRET=$ADMIN_CREATE_SECRET
      PUBLIC_URL=$PUBLIC_URL
      FRONTEND_URL=$FRONTEND_URL
      NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      RESEND_API_KEY=$RESEND_API_KEY
      MAIL_FROM=$MAIL_FROM
      MAIL_FROM_NAME=$MAIL_FROM_NAME
      EOF

    # ── Write lead-pipeline .env ──────────────────────────
    - |
      cat > /opt/ethiopia-construction/lead-pipeline/.env << EOF
      TEST_MODE=false
      TEST_LIMIT=5
      CITY=Addis Ababa
      KEYWORD=Construction Company
      EOF

    # ── Deploy main SaaS ──────────────────────────────────
    - echo "🏗️ Building main SaaS..."
    - cd /opt/ethiopia-construction
    - docker compose build
    - docker compose down
    - docker compose up -d

    # ── Deploy leads dashboard ────────────────────────────
    - echo "📊 Building leads dashboard..."
    - cd /opt/ethiopia-construction/leads-dashboard
    - docker compose build
    - docker compose down
    - docker compose up -d

    # ── Verify all containers ─────────────────────────────
    - sleep 10
    - echo "🔍 Container status:"
    - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

    # ── Health checks ─────────────────────────────────────
    - curl -f http://localhost/health || echo "⚠️ SaaS health check pending..."
    - curl -f http://localhost:5555 || echo "⚠️ Dashboard health check pending..."

    - echo "✅ Deployment complete!"

  only:
    - main
  environment:
    name: production
    url: http://196.188.249.162
