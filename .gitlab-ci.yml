stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - linux_ad_vm-runner # Ensure this matches the tag of your GitLab Runner
  script:
    - echo "🚀 Deploying to production..."

    # Copy built source to deploy path
    - cp -r $CI_PROJECT_DIR/. /opt/ethiopia-construction/

    # Write fresh .env from GitLab CI variables
    - |
      cat > /opt/ethiopia-construction/.env << EOF
      POSTGRES_DB=$POSTGRES_DB
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      JWT_SECRET=$JWT_SECRET
      ADMIN_CREATE_SECRET=$ADMIN_CREATE_SECRET
      PUBLIC_URL=$PUBLIC_URL
      FRONTEND_URL=$FRONTEND_URL
      NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      EOF

    # Deploy
    - rsync -av --delete --exclude='.git' $CI_PROJECT_DIR/ /opt/ethiopia-construction/
    - cd /opt/ethiopia-construction
    - docker compose down --remove-orphans
    - docker compose build
    - docker compose up -d

    # Verify
    - sleep 10
    - docker compose ps
    - echo "✅ Deployment complete!"

  only:
    - main
  environment:
    name: production
    url: http://196.188.249.162
