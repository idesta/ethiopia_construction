stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - linux_ad_vm-runner
  timeout: 30 minutes
  script:
    - echo "🚀 Deploying to production..."

    # Copy source to deploy path
    - rsync -av --exclude='.git' --exclude='node_modules' $CI_PROJECT_DIR/ /opt/ethiopia-construction/

    # Write fresh .env
    - |
      cat > /opt/ethiopia-construction/.env << EOF
      POSTGRES_DB=$POSTGRES_DB
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      JWT_SECRET=$JWT_SECRET
      ADMIN_CREATE_SECRET=$ADMIN_CREATE_SECRET
      PUBLIC_URL=$PUBLIC_URL
      FRONTEND_URL=$FRONTEND_URL
      NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      RESEND_API_KEY=$RESEND_API_KEY
      MAIL_FROM=$MAIL_FROM
      EOF

    # Deploy with cache (much faster)
    - cd /opt/ethiopia-construction
    - docker compose build
    - docker compose down
    - docker compose up -d

    # Verify
    - sleep 8
    - docker compose ps
    - curl -f http://localhost/health || echo "Health check pending..."
    - echo "✅ Deployment complete!"

  only:
    - main
  environment:
    name: production
    url: http://196.188.249.162
